[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/generate-caption"
  to = "/.netlify/functions/generate-caption"
  status = 200

[[redirects]]
  from = "/api/generate-hooks"
  to = "/.netlify/functions/generate-hooks"
  status = 200
